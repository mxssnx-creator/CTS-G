name: Desk and engine checks

on:
  pull_request:
    branches: [Stable-02-01, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check types
        run: npm run typecheck
      - name: Run JavaScript tests
        run: node --test scripts/*.test.mjs
      - name: Run TypeScript tests
        run: node scripts/run-ts-tests.mjs
      - name: Verify regression scheduling
        run: |
          python3 scripts/test_regression_scheduling.py
          python3 scripts/test_regression_progress.py
          python3 scripts/test_replay_memo.py
          python3 scripts/test_regression_memo.py
          python3 scripts/test_bounded_replay_build.py
      - name: Run offline engine tests
        run: python3 scripts/regression/run.py --jobs 4
      - name: Check VST transport and accounting offline
        run: |
          PYTHONPATH=server/pulse:scripts python3 -m unittest scripts/test_x02_batch.py
          python3 scripts/test_bingx_signed_pool.py
          python3 scripts/test_native_fill_audit.py
          python3 scripts/test_position_settlement.py
          python3 scripts/test_compact_replay_memory.py
          python3 scripts/test_indication_feature_cache.py
      - name: Check x02 ownership and protection offline
        run: |
          python3 scripts/test_x02_native_session.py
          python3 scripts/test_native_cleanup_evidence.py
          python3 scripts/test_fee_scope_refresh.py
          python3 scripts/test_venue_fill_fees.py
          python3 scripts/test_disjoint_lastn.py
          python3 scripts/test_trailing_control_pacing.py
          python3 scripts/test_project_order_identity.py
          python3 scripts/test_control_coverage.py
          python3 scripts/test_demo_acceptance_ownership.py
          python3 scripts/test_x02_universe.py
      - name: Check independent replay and imported sources
        run: |
          python3 scripts/test_audit_reporting.py
          python3 scripts/test_strategy_switches.py
          python3 scripts/test_indexed_stage_query.py
          python3 scripts/test_parallel_native_replay.py
          python3 scripts/test_indication_primitives.py
          python3 scripts/test_ported_indications.py
          node --experimental-strip-types --test shared/cts-indications/ported.test.ts shared/cts-volume/ratios.test.ts
