name: Strategy feature verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      CTS_BUILD_NODE_HEAP_MB: '4096'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy httpx websocket-client
      - run: npm run typecheck
      - run: npm run test:strategy-features
      - run: npm run test:lastn-blocks
      - run: python3 scripts/test_project_order_identity.py
      - run: python3 scripts/test_disjoint_lastn.py
      - run: python3 scripts/test_trailing_control_pacing.py
      - run: npm run build:dev
