name: Runtime verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CTS_G_NAME: cts-g-ci
      CTS_DATA_DIR: /tmp/cts-g-ci/data
      CTS_LOG_DIR: /tmp/cts-g-ci/logs
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: python3 scripts/engine-test.py
      - run: npm run build
      - run: node scripts/verify-production-runtime.mjs
      - name: Shell syntax
        run: |
          for file in deploy/*.sh; do bash -n "$file"; done
