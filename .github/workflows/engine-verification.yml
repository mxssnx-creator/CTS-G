name: Engine verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Job-level env is evaluated before the runner context exists.
      # ubuntu-latest gives this job its own temporary filesystem.
      CTS_DATA_DIR: /tmp/cts-g-verification
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            server/pulse/requirements.txt
            scripts/requirements-test.txt
      - name: Install isolated declared dependencies
        run: python -m pip install -r server/pulse/requirements.txt -r scripts/requirements-test.txt
      - name: Import and installation namespace contracts
        run: python scripts/release-contract-test.py
      - name: Forced grid and replay correctness
        run: python scripts/forced-config-test.py
      - name: Complete offline engine suite
        run: python scripts/engine-test.py
      - name: Independent entries, partial fills and configuration regressions
        run: python -m unittest discover -s scripts -p 'test_*.py'
