name: Engine verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CTS_DATA_DIR: ${{ runner.temp }}/cts-g-verification
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/pulse/requirements.txt
      - name: Install isolated declared dependencies
        run: python -m pip install -r server/pulse/requirements.txt
      - name: Import and installation namespace contracts
        run: python scripts/release-contract-test.py
      - name: Forced grid and replay correctness
        run: python scripts/forced-config-test.py
      - name: Complete offline engine suite
        run: python scripts/engine-test.py
